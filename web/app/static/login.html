<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Sign in</title><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/admin.css"><script type="module" src="/static/login.js"></script></head>
<body class="login-page"><section class="login-art" aria-label="Display control"><div class="brand"><span class="mark" aria-hidden="true"></span><span id="site-name">Signage</span></div><div><div class="eyebrow">DISPLAY CONTROL</div><h1>Display<br>management.</h1><p>Manage content, schedules<br>and screen assignments.</p><div class="login-lines" aria-hidden="true"><span>01</span><span>02</span><span>03</span></div></div><footer>Administrator workspace</footer></section>
<main class="login-panel"><form id="f" class="login-form"><div class="eyebrow">WORKSPACE ACCESS</div><h1>Sign in</h1><p>Sign in to manage your displays.</p><div class="field"><label for="u">Username</label><input id="u" name="username" type="text" autocomplete="username" required maxlength="64" autofocus spellcheck="false" autocapitalize="none"></div><div class="field"><label for="p">Password</label><div class="password-control"><input id="p" name="password" type="password" autocomplete="current-password" required maxlength="128"><button id="show-password" type="button" aria-pressed="false">Show</button></div></div><div class="err-text" id="e" role="alert"></div><button id="submit" class="btn primary" type="submit">Sign in <span aria-hidden="true">→</span></button><div class="login-note">Access is limited to workspace administrators.</div></form></main><div id="toasts"></div></body></html>
