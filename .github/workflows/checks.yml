name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream ref
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install converter test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 ffmpeg libreoffice-impress poppler-utils
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run syntax and regression checks
        run: sh scripts/check.sh
# No deployment, cloud credentials, media, Docker socket or office-network access.
# Physical playback, NAS reboot, Docker/HLS builds and scans are separate gates.
