name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified upstream ref
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install converter test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 ffmpeg libreoffice-impress poppler-utils
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run syntax and regression checks
        run: sh scripts/check.sh
# No deployment, cloud credentials, media, Docker socket or office-network access.
# Physical playback, NAS reboot, Docker/HLS builds and scans are separate gates.
