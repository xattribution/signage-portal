# Example for a host-level Nginx in front of the loopback-published web service.
# Substitute your hostname, certificate paths and signage VLAN IP before loading.
# Validate with `nginx -t`; this configuration was not executed in this review.
# Place in the http{} context (for example conf.d/signage.conf).
limit_req_zone $binary_remote_addr zone=signage_login:1m rate=6r/m;

server {
    listen 80;
    server_name signage.example.org;
    return 308 https://signage.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name signage.example.org;
    ssl_certificate /etc/ssl/signage/fullchain.pem;
    ssl_certificate_key /etc/ssl/signage/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Slightly more than the default 2 GiB file cap for multipart overhead.
    # Keep this aligned with MAX_UPLOAD_MB; the application also counts bytes.
    client_max_body_size 2049m;
    client_body_timeout 60s;
    send_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    location = /auth/login {
        limit_req zone=signage_login burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

# Dedicated playback vhost; certificate must cover this hostname. Keep this
# listener reachable only from the signage/user-viewer VLANs. Do not put an
# interactive Cloudflare Access login in front of display playback.
server {
    listen 443 ssl;
    server_name play.signage.example.org;
    ssl_certificate /etc/ssl/signage/fullchain.pem;
    ssl_certificate_key /etc/ssl/signage/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    location ~ ^/(display/|stream/|preview/|api/player/|media/|static/(player|overlay)\.(js|css)$|static/feed\.svg$|static/vendor/hls\.min\.js$|healthz$) {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
    }
    location / { return 404; }
}
