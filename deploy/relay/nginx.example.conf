# Inside a TLS vhost for video.signage.example.org. Configure certificates and
# signage-VLAN firewall rules separately. No admin or arbitrary proxy endpoint.
location / { return 404; }
location ^~ /office-live/ {
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:8888;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
}
