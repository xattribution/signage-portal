# Quick start: `docker compose up -d`, then open http://<server-ip>:51480 and finish setup
# in the browser. No .env file is needed. Data lives in Docker volumes; for NAS storage
# and systemd startup add docker-compose.host-storage.yml (see docs/INSTALL.md).
name: signage

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *hardening
    build: ./web
    image: signage-web:modern
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      MEDIA_DIR: /media
      # Optional code for the first-launch setup page (also read from .env).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      # Change with SIGNAGE_PORT=xxxxx; set SIGNAGE_BIND=127.0.0.1 when a reverse proxy fronts it.
      - "${SIGNAGE_BIND:-0.0.0.0}:${SIGNAGE_PORT:-51480}:51480"
    volumes:
      - signage-data:/data
      - signage-spool:/spool
      - signage-originals:/media/originals
      - signage-work:/media/work
      - signage-rendered:/media/rendered
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    pids_limit: 200
    mem_limit: 768m
    cpus: 2
    networks: [front]

  worker:
    <<: *hardening
    build: ./worker
    image: signage-worker:modern
    # The converter never has a network, the database, secrets or the served media.
    network_mode: none
    depends_on: [web]
    environment:
      ORIGINALS_DIR: /media/originals
      WORK_DIR: /media/work
      REQUIRE_MEDIA_MARKERS: ${REQUIRE_MEDIA_MARKERS:-false}
      MEDIA_VOLUME_ID: ${MEDIA_VOLUME_ID:-}
      CONVERT_MEM_MB: ${CONVERT_MEM_MB:-3072}
      CONVERT_CPU_SECONDS: ${CONVERT_CPU_SECONDS:-3600}
      CONVERT_WALL_SECONDS: ${CONVERT_WALL_SECONDS:-3600}
      CONVERT_MAX_OUTPUT_MB: ${MAX_INGEST_MB:-8192}
    volumes:
      - signage-originals:/media/originals:ro
      - signage-work:/media/work
    tmpfs:
      - /tmp:size=4g,noexec,nosuid,nodev,mode=1777
    pids_limit: 256
    mem_limit: 4g
    cpus: 2

volumes:
  signage-data:
  signage-spool:
  signage-originals:
  signage-work:
  signage-rendered:

networks:
  front: {}
